name: Stage PBRT v4 for ChatGPT VM

on:
  push:
    branches:
      - torsionfield/scriptcat-1.5-bootstrap
    paths:
      - .github/workflows/stage-pbrt-v4-vm.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone PBRT and every submodule through gh-proxy
        shell: bash
        run: |
          set -euxo pipefail
          git config --global url."https://gh-proxy.com/https://github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://gh-proxy.com/https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://gh-proxy.com/https://github.com/".insteadOf "ssh://git@github.com/"
          git clone --recursive --depth 1 https://gh-proxy.com/https://github.com/mmp/pbrt-v4.git pbrt-v4
          cd pbrt-v4
          git rev-parse HEAD | tee ../PBRT_COMMIT.txt
          git submodule status --recursive | tee ../PBRT_SUBMODULES.txt
          find . -type d -name .git -prune -exec rm -rf {} +
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../PBRT_SOURCE_SHA256.txt
          cd ..
          tar -cf pbrt-v4-complete-source.tar pbrt-v4 PBRT_COMMIT.txt PBRT_SUBMODULES.txt PBRT_SOURCE_SHA256.txt
          sha256sum pbrt-v4-complete-source.tar > pbrt-v4-complete-source.tar.sha256

      - name: Upload complete source tree
        uses: actions/upload-artifact@v4
        with:
          name: pbrt-v4-complete-source
          path: |
            pbrt-v4-complete-source.tar
            pbrt-v4-complete-source.tar.sha256
          compression-level: 1
          retention-days: 3
