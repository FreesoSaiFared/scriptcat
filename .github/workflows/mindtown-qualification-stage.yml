name: MindTown qualification source staging

on:
  push:
    paths:
      - .github/workflows/mindtown-qualification-stage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group:
          - core
          - tooling
          - alternatives
    steps:
      - name: Download current repository archives through gh-proxy.com
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p source-archives
          case "${{ matrix.group }}" in
            core)
              repos=(
                playcanvas/engine
                playcanvas/editor
                playcanvas/editor-mcp-server
                scriptscat/scriptcat
                srbhptl39/MCP-SuperAssistant
              )
              ;;
            tooling)
              repos=(
                isaac-mason/recast-navigation-js
                donmccurdy/glTF-Transform
                vercel-labs/agent-browser
                hermes-agent-org/hermes
              )
              ;;
            alternatives)
              repos=(
                mrdoob/three.js
                BabylonJS/Babylon.js
              )
              ;;
          esac
          : > source-archives/SOURCE_LOCKS.tsv
          for repo in "${repos[@]}"; do
            sha="$(git ls-remote "https://github.com/${repo}.git" HEAD | awk '{print $1}')"
            test -n "$sha"
            slug="${repo//\//__}"
            url="https://gh-proxy.com/https://github.com/${repo}/archive/${sha}.zip"
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
              "$url" -o "source-archives/${slug}__${sha}.zip"
            unzip -tq "source-archives/${slug}__${sha}.zip"
            printf '%s\t%s\t%s\n' "$repo" "$sha" "$url" >> source-archives/SOURCE_LOCKS.tsv
          done
          sha256sum source-archives/*.zip > source-archives/SHA256SUMS
          du -h source-archives/*
      - name: Upload source group
        uses: actions/upload-artifact@v4
        with:
          name: mindtown-qualification-${{ matrix.group }}-sources
          path: source-archives/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
