name: Stage Three.js r185 core through gh-proxy

on:
  push:
    branches:
      - staging/img2threejs-ghproxy-d6673386
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-three-core:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned Three.js core through gh-proxy
        shell: bash
        run: |
          set -euo pipefail
          url='https://gh-proxy.com/https://raw.githubusercontent.com/mrdoob/three.js/r185/build/three.core.min.js'
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 \
            "$url" -o three.core.min.js
          test -s three.core.min.js
          grep -q 'REVISION' three.core.min.js
          sha256sum three.core.min.js | tee THREE_CORE_SHA256.txt
          printf '%s\n' 'repository=mrdoob/three.js' 'tag=r185' "source_url=$url" > THREE_CORE_PROVENANCE.txt

      - name: Upload Three.js core
        uses: actions/upload-artifact@v4
        with:
          name: three-core-r185-runtime
          path: |
            three.core.min.js
            THREE_CORE_SHA256.txt
            THREE_CORE_PROVENANCE.txt
          if-no-files-found: error
          retention-days: 7
