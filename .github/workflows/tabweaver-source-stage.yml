name: Internal VM ScriptCat dependency relay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download exact temporary release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p staged
          gh release download internal-vm-scriptcat-deps-3a6c7132-20260806 \
            --repo FreesoSaiFared/scriptcat \
            --dir staged \
            --pattern 'pnpm-10.34.1.tgz' \
            --pattern 'pnpm-store-content-v10.tar.xz'
          sha256sum staged/* | tee staged/SHA256SUMS
          tar -tzf staged/pnpm-10.34.1.tgz | grep -F 'pnpm/10.34.1/bin/pnpm.cjs'
          xz -t staged/pnpm-store-content-v10.tar.xz
      - name: Upload immutable dependency relay
        uses: actions/upload-artifact@v4
        with:
          name: scriptcat-candidate-debian-dependencies
          path: staged/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error