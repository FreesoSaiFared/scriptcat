name: Internal VM current-branch source and runtime staging

on:
  push:
    paths:
      - .github/workflows/tabweaver-source-stage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record and archive exact source commit
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p staged-source staged-runtime staged-evidence
          git rev-parse HEAD | tee staged-evidence/COMMIT_SHA
          git status --short | tee staged-evidence/GIT_STATUS.txt
          git archive --format=tar.gz --prefix="scriptcat-${GITHUB_SHA}/" -o staged-source/scriptcat-${GITHUB_SHA}.tar.gz "${GITHUB_SHA}"
          sha256sum staged-source/* | tee staged-evidence/SOURCE_SHA256SUMS

      - name: Install and test focused lab candidate
        shell: bash
        run: |
          set -euxo pipefail
          node --check userscripts/transductive-prompt-runtime.chatgpt-lab-core.js
          node --check userscripts/transductive-prompt-runtime.chatgpt-lab.user.js
          node --check userscripts/transductive-prompt-runtime.chatgpt-lab.test.cjs
          node userscripts/transductive-prompt-runtime.chatgpt-lab.test.cjs | tee staged-evidence/lab-test.log
          node userscripts/transductive-prompt-runtime.chatgpt-lab-core.js | tee staged-evidence/core-self-test.log

      - name: Build production extension
        shell: bash
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@10.34.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build | tee staged-evidence/build.log
          cp -a dist/ext staged-runtime/scriptcat-extension
          find staged-runtime -type f -print0 | sort -z | xargs -0 sha256sum > staged-evidence/RUNTIME_SHA256SUMS

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: internalvm-scriptcat-source-${{ github.sha }}
          path: |
            staged-source/
            staged-evidence/COMMIT_SHA
            staged-evidence/GIT_STATUS.txt
            staged-evidence/SOURCE_SHA256SUMS
          compression-level: 0
          retention-days: 3

      - name: Upload built runtime and evidence
        uses: actions/upload-artifact@v4
        with:
          name: internalvm-scriptcat-runtime-${{ github.sha }}
          path: |
            staged-runtime/
            staged-evidence/
          compression-level: 0
          retention-days: 3
