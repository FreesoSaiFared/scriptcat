name: Internal VM ScriptCat offline dependencies

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3a6c7132e3a4436d8cd631d570e6f635418b6aad
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Resolve exact locked dependencies
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "3a6c7132e3a4436d8cd631d570e6f635418b6aad"
          corepack enable
          corepack prepare pnpm@10.34.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          mkdir -p staged/pnpm-cli
          npm install --prefix staged/pnpm-cli --ignore-scripts pnpm@10.34.1
          tar --zstd -cf staged/scriptcat-node_modules.tar.zst node_modules
          tar --zstd -cf staged/pnpm-cli.tar.zst -C staged pnpm-cli
          sha256sum staged/*.tar.zst | tee staged/SHA256SUMS
          du -sh node_modules staged/*
      - name: Upload exact offline dependencies
        uses: actions/upload-artifact@v4
        with:
          name: scriptcat-candidate-offline-dependencies
          path: staged/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error