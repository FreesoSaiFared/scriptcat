name: ChatGPT convert Quaternius Kimono Male to GLB v2

on:
  push:
    branches:
      - chatgpt/miegakure-kimono-glb-20260818
  pull_request:
    branches:
      - chatgpt/miegakure-free-art-quarry-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch CC0 Quaternius character pack
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors 'https://opengameart.org/sites/default/files/ultimate_animated_character_pack_by_quaternius.zip' -o pack.zip
          unzip -q pack.zip -d pack
          FBX=$(find pack -type f -name 'Kimono_Male.fbx' | head -1)
          test -n "$FBX"
          cp "$FBX" Kimono_Male.fbx
          sha256sum pack.zip Kimono_Male.fbx | tee source.sha256
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
          blender --version | head -3
      - name: Convert FBX to GLB with animation and skin
        run: |
          cat > convert.py <<'PY'
          import bpy, os
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.fbx(filepath=os.path.abspath('Kimono_Male.fbx'), automatic_bone_orientation=False)
          bpy.ops.export_scene.gltf(filepath=os.path.abspath('Kimono_Male.glb'), export_format='GLB', export_animations=True, export_skins=True, export_morph=True, export_apply=False)
          print('objects', [(o.name,o.type) for o in bpy.context.scene.objects])
          PY
          blender -b --python convert.py
          test -s Kimono_Male.glb
          sha256sum Kimono_Male.glb | tee output.sha256
          ls -lh Kimono_Male.glb
      - name: Upload converted rig
        uses: actions/upload-artifact@v4
        with:
          name: miegakure-quaternius-kimono-male-glb-v2
          compression-level: 0
          path: |
            Kimono_Male.glb
            source.sha256
            output.sha256
