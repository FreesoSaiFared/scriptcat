name: Stage PBRT v4 and Imath for ChatGPT VM

on:
  push:
    branches:
      - torsionfield/scriptcat-1.5-bootstrap
    paths:
      - .github/workflows/stage-pbrt-v4-vm-imath.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone PBRT recursively and Imath through gh-proxy
        shell: bash
        run: |
          set -euxo pipefail
          git config --global url."https://gh-proxy.com/https://github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://gh-proxy.com/https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://gh-proxy.com/https://github.com/".insteadOf "ssh://git@github.com/"
          git clone --recursive --depth 1 https://gh-proxy.com/https://github.com/mmp/pbrt-v4.git pbrt-v4
          git clone --depth 1 --branch v3.1.12 https://gh-proxy.com/https://github.com/AcademySoftwareFoundation/Imath.git imath-3.1.12
          (cd pbrt-v4 && git rev-parse HEAD) | tee PBRT_COMMIT.txt
          (cd pbrt-v4 && git submodule status --recursive) | tee PBRT_SUBMODULES.txt
          (cd imath-3.1.12 && git rev-parse HEAD) | tee IMATH_COMMIT.txt
          find pbrt-v4 imath-3.1.12 -type d -name .git -prune -exec rm -rf {} +
          find pbrt-v4 imath-3.1.12 -type f -print0 | sort -z | xargs -0 sha256sum > SOURCE_SHA256.txt
          tar -cf pbrt-v4-imath-complete-source.tar pbrt-v4 imath-3.1.12 PBRT_COMMIT.txt PBRT_SUBMODULES.txt IMATH_COMMIT.txt SOURCE_SHA256.txt
          sha256sum pbrt-v4-imath-complete-source.tar > pbrt-v4-imath-complete-source.tar.sha256

      - name: Upload complete offline source tree
        uses: actions/upload-artifact@v4
        with:
          name: pbrt-v4-imath-complete-source
          path: |
            pbrt-v4-imath-complete-source.tar
            pbrt-v4-imath-complete-source.tar.sha256
          compression-level: 1
          retention-days: 3
