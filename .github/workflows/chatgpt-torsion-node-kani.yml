name: chatgpt-torsion-node-kani

on:
  push:
    branches:
      - chatgpt/torsion-node-kani-config-20260807
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Normal Torsion Node Rust tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p chatgpt-lab/evidence-kani
          cargo test --locked --manifest-path torsion-node/Cargo.toml | tee chatgpt-lab/evidence-kani/cargo-test.log
      - name: Install pinned Kani 0.67.0 on the current runner
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup
          cargo kani --version | tee chatgpt-lab/evidence-kani/kani-version.log
      - name: Run bounded Kani proofs
        shell: bash
        run: |
          set -euo pipefail
          cd torsion-node
          cargo kani --output-format=terse | tee ../chatgpt-lab/evidence-kani/kani.log
      - name: Record successful bounded proof campaign
        shell: bash
        run: |
          set -euo pipefail
          cat > chatgpt-lab/evidence-kani/RESULT.txt <<'EOF'
          TORSION_NODE_KANI_IDENTIFIER_PROOFS_VERIFIED
          target: real torsion-node validate_identifier contract
          Kani: 0.67.0
          normal cargo tests: passed
          Kani proof suite: passed
          proof-only source is cfg(kani), so release behavior is unchanged
          EOF
          sha256sum torsion-node/src/config.rs torsion-node/src/kani_proofs.rs torsion-node/src/lib.rs > chatgpt-lab/evidence-kani/SHA256SUMS
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: torsion-node-kani-identifier-evidence
          path: chatgpt-lab/evidence-kani/
          if-no-files-found: error
          retention-days: 14
