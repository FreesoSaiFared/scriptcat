name: dancers-debian13-ci
on:
  push:
    branches:
      - chatgpt/dancers-runtime-mailbox-20260929
    paths:
      - tools/dancers-runtime/danceseq.py
      - tools/dancers-runtime/compile_plan.py
      - tools/dancers-runtime/state_to_openpose.py
      - tools/dancers-runtime/blender_compile_state.py
      - tools/dancers-runtime/accept_debian13_container.sh
      - .github/workflows/dancers-debian13-ci.yml
  workflow_dispatch:

jobs:
  debian13:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Run one strict portable-core script in clean Debian 13
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf debian13-evidence runtime-debian13 out-debian13
          mkdir -p debian13-evidence
          chmod +x tools/dancers-runtime/accept_debian13_container.sh
          docker run --rm --shm-size=2g \
            -v "$PWD:/work" -w /work \
            debian:13-slim \
            bash /work/tools/dancers-runtime/accept_debian13_container.sh
          test -s debian13-evidence/DEBIAN13_ACCEPTANCE.json
          python3 - <<'PY'
          import json
          r=json.load(open('debian13-evidence/DEBIAN13_ACCEPTANCE.json'))
          assert r['schema']=='DANCERS_DEBIAN13_ACCEPTANCE/2'
          assert r['pass_core'] is True
          assert r['sd_cli']['ldd_clean'] is True
          assert r['control_openpose']['ok'] is True
          for k in ('workbench','eevee','cycles_cpu'):
              assert r['renders'][k]['status']=='ok', (k,r['renders'][k])
          print(json.dumps({
              'pass_core':r['pass_core'],
              'blender':r['blender'],
              'sd_cli_ldd_clean':r['sd_cli']['ldd_clean'],
              'render_seconds':{k:r['renders'][k]['seconds'] for k in ('workbench','eevee','cycles_cpu')},
              'packed_glb_bytes':r['packed_glb']['bytes']
          },sort_keys=True))
          PY
      - name: Upload Debian 13 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dancers-debian13-acceptance-v2
          path: debian13-evidence/
          retention-days: 7
