name: dancers-debian13-ci
on:
  push:
    branches:
      - chatgpt/dancers-runtime-mailbox-20260929
    paths:
      - tools/dancers-runtime/danceseq.py
      - tools/dancers-runtime/compile_plan.py
      - tools/dancers-runtime/state_to_openpose.py
      - tools/dancers-runtime/blender_compile_state.py
      - .github/workflows/dancers-debian13-ci.yml
  workflow_dispatch:

jobs:
  debian13:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Run complete portable core acceptance in clean Debian 13
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p debian13-evidence
          docker run --rm --shm-size=2g \
            -v "$PWD:/work" -w /work \
            debian:13-slim bash -lc '
              set -Eeuo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                ca-certificates curl xz-utils unzip python3 xz-utils \
                xvfb xauth libgl1 libegl1 libx11-6 libxi6 libxrender1 libxfixes3 \
                libxxf86vm1 libxkbcommon0 libsm6 libice6 libfontconfig1 libfreetype6 \
                libdbus-1-3 libwayland-client0 libwayland-egl1 libtbb12 libzstd1 \
                > debian13-evidence/apt.txt
              rm -rf /var/lib/apt/lists/*
              mkdir -p runtime out

              echo "== Debian ==" | tee debian13-evidence/host.txt
              cat /etc/os-release | tee -a debian13-evidence/host.txt
              uname -a | tee -a debian13-evidence/host.txt
              lscpu 2>/dev/null | tee -a debian13-evidence/host.txt || true

              BLENDER_VER=4.5.14
              BLENDER_FILE="blender-${BLENDER_VER}-linux-x64.tar.xz"
              curl -fL --retry 5 --retry-delay 2 -o "runtime/${BLENDER_FILE}" \
                "https://download.blender.org/release/Blender4.5/${BLENDER_FILE}"
              curl -fL --retry 5 --retry-delay 2 -o runtime/blender.sha256 \
                "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VER}.sha256"
              grep "${BLENDER_FILE}" runtime/blender.sha256 | (cd runtime && sha256sum -c -)
              tar -C runtime -xf "runtime/${BLENDER_FILE}"
              BLENDER=$(find runtime -maxdepth 3 -type f -name blender -perm -111 -print -quit)
              test -n "$BLENDER"
              "$BLENDER" --version | tee debian13-evidence/blender-version.txt
              ldd "$BLENDER" | tee debian13-evidence/blender-ldd.txt
              if grep -q "not found" debian13-evidence/blender-ldd.txt; then
                echo "Missing Blender shared libraries" >&2; exit 20
              fi

              SD_TAG=master-929-3f8527a
              SD_FILE=sd-master-3f8527a-bin-Linux-Ubuntu-24.04-x86_64.zip
              curl -fL --retry 5 --retry-delay 2 -o runtime/sd.zip \
                "https://github.com/leejet/stable-diffusion.cpp/releases/download/${SD_TAG}/${SD_FILE}"
              echo "9ad35ed309dbe59f5e66f35edafac9a69e6cc233ea6b9577071feae829159d37  runtime/sd.zip" | sha256sum -c -
              unzip -q runtime/sd.zip -d runtime/sd
              SD_BIN=$(find runtime/sd -type f -perm -111 -name sd-cli -print -quit)
              test -n "$SD_BIN"
              ldd "$SD_BIN" | tee debian13-evidence/sd-ldd.txt
              "$SD_BIN" --help > debian13-evidence/sd-help.txt 2>&1 || true

              GLTFPACK_FILE=gltfpack-ubuntu.zip
              curl -fL --retry 5 --retry-delay 2 -o runtime/gltfpack.zip \
                "https://github.com/zeux/meshoptimizer/releases/download/v1.3/${GLTFPACK_FILE}"
              echo "0666d9dc40d60fe5b9a45f3fc24f8e6ca87112974bd5de9ca57152aa13d06017  runtime/gltfpack.zip" | sha256sum -c -
              unzip -q runtime/gltfpack.zip -d runtime/gltfpack
              chmod +x runtime/gltfpack/gltfpack

              cat > out/debian13.danceseq <<"EOF"
              DANCESEQ/1
              bpm 124
              fps 24
              duration_frames 96
              FORM V_SHALLOW
              F001 ALL pose neutral
              F024 D1,D5 step inward 0.31m
              F024 D3 pelvis.z -0.19m
              F048 ALL pelvis.yaw -18deg
              F048 ALL chest.look camera
              F072 ALL root.z +0.17m
              F072 ALL root.y -0.24m
              F096 ALL pose loop_ready
              CONTACT preserve_support
              EOF
              python3 tools/dancers-runtime/danceseq.py out/debian13.danceseq -o out/debian13.plan.json
              python3 tools/dancers-runtime/compile_plan.py out/debian13.danceseq -o out/debian13.state.json
              python3 tools/dancers-runtime/state_to_openpose.py out/debian13.state.json \
                -o out/control-openpose.png --frame 48 --receipt out/control-openpose.json
              test -s out/control-openpose.png

              xvfb-run -a "$BLENDER" -b --python tools/dancers-runtime/blender_compile_state.py -- \
                --state "$PWD/out/debian13.state.json" --out "$PWD/out" --preview-frame 48
              test -s out/five-dancer.blend
              test -s out/five-dancer-raw.glb
              test -s out/blender-receipt.json
              runtime/gltfpack/gltfpack -i out/five-dancer-raw.glb -o out/five-dancer-packed.glb -cc \
                > debian13-evidence/gltfpack.txt 2>&1 || \
                runtime/gltfpack/gltfpack -i out/five-dancer-raw.glb -o out/five-dancer-packed.glb \
                > debian13-evidence/gltfpack.txt 2>&1
              test -s out/five-dancer-packed.glb

              python3 - <<"PY"
              import json,hashlib,pathlib,platform,os
              out=pathlib.Path("out")
              b=json.load(open(out/"blender-receipt.json"))
              c=json.load(open(out/"control-openpose.json"))
              def meta(p):
                  p=pathlib.Path(p); h=hashlib.sha256()
                  with p.open("rb") as f:
                      for x in iter(lambda:f.read(1048576),b""): h.update(x)
                  return {"bytes":p.stat().st_size,"sha256":h.hexdigest()}
              renders={r["label"]:r for r in b["renders"]}
              rec={
                "schema":"DANCERS_DEBIAN13_ACCEPTANCE/1",
                "debian":"13",
                "machine":platform.machine(),
                "cpu_count":os.cpu_count(),
                "blender":b["blender"],
                "control_openpose":{"ok":c["actor_count"]==5,"artifact":meta(out/"control-openpose.png")},
                "renders":{k:{"status":v["status"],"seconds":v.get("seconds"),"engine":v.get("engine")} for k,v in renders.items()},
                "raw_glb":meta(out/"five-dancer-raw.glb"),
                "packed_glb":meta(out/"five-dancer-packed.glb"),
                "sd_cli_probe":True,
              }
              rec["pass_core"] = all(renders.get(k,{}).get("status")=="ok" for k in ("workbench","eevee","cycles_cpu")) and rec["control_openpose"]["ok"]
              pathlib.Path("debian13-evidence/DEBIAN13_ACCEPTANCE.json").write_text(json.dumps(rec,indent=2)+"\n")
              print(json.dumps(rec,indent=2))
              if not rec["pass_core"]: raise SystemExit(21)
              PY
              cp out/control-openpose.png out/workbench.png out/eevee.png out/cycles_cpu.png \
                 out/five-dancer-packed.glb debian13-evidence/
              sha256sum debian13-evidence/* > debian13-evidence/SHA256SUMS
            '
      - name: Upload Debian 13 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dancers-debian13-acceptance
          path: debian13-evidence/
          retention-days: 7
