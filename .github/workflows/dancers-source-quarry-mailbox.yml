name: dancers-source-quarry-mailbox
on:
  push:
    branches:
      - chatgpt/dancers-runtime-mailbox-20260929
    paths:
      - .github/workflows/dancers-source-quarry-mailbox.yml
  workflow_dispatch:

jobs:
  quarry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Acquire, hash, and split every selected source in one script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources manifest chunks
          cat > repos.tsv <<'EOF'
          MuSkeMo	https://github.com/PashavanBijlert/MuSkeMo.git
          BlendOsim	https://github.com/JonathanCamargo/BlendOsim.git
          opensim-core	https://github.com/opensim-org/opensim-core.git
          opensim-models	https://github.com/opensim-org/opensim-models.git
          human_body_prior	https://github.com/nghorbani/human_body_prior.git
          smplx	https://github.com/vchoutas/smplx.git
          SMPL2AddBiomechanics	https://github.com/MarilynKeller/SMPL2AddBiomechanics.git
          AddBiomechanics	https://github.com/keenon/AddBiomechanics.git
          nimblephysics	https://github.com/keenon/nimblephysics.git
          EasyMocap	https://github.com/zju3dv/EasyMocap.git
          freemocap	https://github.com/freemocap/freemocap.git
          freemocap_blender_addon	https://github.com/freemocap/freemocap_blender_addon.git
          skellytracker	https://github.com/freemocap/skellytracker.git
          mmpose	https://github.com/open-mmlab/mmpose.git
          motion-diffusion-model	https://github.com/GuyTevet/motion-diffusion-model.git
          stable-diffusion.cpp	https://github.com/leejet/stable-diffusion.cpp.git
          meshoptimizer	https://github.com/zeux/meshoptimizer.git
          EOF

          cat > manifest/source-policy.txt <<'EOF'
          DANCERS_SOURCE_POLICY/3
          license_filtering=false
          bundle_all_selected_sources=true
          includes_biomechanics_models=true
          includes_smpl_biomechanics_bridges=true
          includes_mocap_blender_bridge=true
          transport=350MiB_chunks
          EOF

          : > manifest/sources.tsv
          while IFS=$'\t' read -r name url; do
            sha=$(git ls-remote "$url" HEAD | awk '{print $1}')
            test -n "$sha"
            base=${url#https://github.com/}; base=${base%.git}
            out="sources/${name}-${sha}.tar.gz"
            curl -fL --retry 5 --retry-delay 2 -o "$out" "https://github.com/${base}/archive/${sha}.tar.gz"
            digest=$(sha256sum "$out" | awk '{print $1}')
            bytes=$(stat -c%s "$out")
            printf '%s\t%s\t%s\t%s\t%s\n' "$name" "$sha" "$digest" "$bytes" "$url" >> manifest/sources.tsv
          done < repos.tsv

          find sources -type f -print0 | sort -z | xargs -0 sha256sum > manifest/source-files.sha256
          tar -czf dancers-source-quarry.tar.gz sources manifest
          sha256sum dancers-source-quarry.tar.gz > manifest/quarry.sha256
          split -b 350M -d -a 2 dancers-source-quarry.tar.gz chunks/quarry.part-
          sha256sum chunks/* > manifest/chunks.sha256
          stat -c '%n\t%s' chunks/* > manifest/chunks.bytes.tsv
          printf 'repos=%s\n' "$(wc -l < manifest/sources.tsv)"
          du -h dancers-source-quarry.tar.gz chunks/*

      - name: Upload quarry chunk 00
        uses: actions/upload-artifact@v4
        with: {name: dancers-source-quarry-00, path: chunks/quarry.part-00, compression-level: 0, retention-days: 7}
      - name: Upload quarry chunk 01
        uses: actions/upload-artifact@v4
        with: {name: dancers-source-quarry-01, path: chunks/quarry.part-01, compression-level: 0, retention-days: 7}
      - name: Upload quarry chunk 02
        uses: actions/upload-artifact@v4
        with: {name: dancers-source-quarry-02, path: chunks/quarry.part-02, compression-level: 0, retention-days: 7}
      - name: Upload quarry manifest
        uses: actions/upload-artifact@v4
        with:
          name: dancers-source-quarry-manifest
          path: manifest/
          retention-days: 7
