name: Stage Blender 4.4.3 for ChatGPT VM

on:
  push:
    branches:
      - torsionfield/scriptcat-1.5-bootstrap
    paths:
      - .github/workflows/stage-blender-4.4.3-vm.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official portable Blender package
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz'
          curl --fail --location --retry 5 --retry-delay 3 "$URL" -o blender-4.4.3-linux-x64.tar.xz
          curl --fail --location --retry 5 --retry-delay 3 'https://download.blender.org/release/Blender4.4/blender-4.4.3.sha256' -o blender-4.4.3.sha256
          grep 'blender-4.4.3-linux-x64.tar.xz' blender-4.4.3.sha256 | sha256sum --check -
          tar -tf blender-4.4.3-linux-x64.tar.xz | sed -n '1,40p' > BLENDER_ARCHIVE_HEAD.txt
          sha256sum blender-4.4.3-linux-x64.tar.xz > BLENDER_PACKAGE_SHA256.txt

      - name: Upload portable Blender runtime
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.4.3-linux-x64-portable
          path: |
            blender-4.4.3-linux-x64.tar.xz
            blender-4.4.3.sha256
            BLENDER_PACKAGE_SHA256.txt
            BLENDER_ARCHIVE_HEAD.txt
          compression-level: 0
          retention-days: 3
