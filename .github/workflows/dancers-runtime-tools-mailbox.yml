name: dancers-runtime-tools-mailbox
on:
  push:
    branches:
      - chatgpt/dancers-runtime-mailbox-20260929
    paths:
      - tools/dancers-runtime/danceseq.py
      - tools/dancers-runtime/compile_plan.py
      - tools/dancers-runtime/blender_compile_state.py
      - tools/dancers-runtime/accept_internal_vm.sh
      - tools/dancers-runtime/bootstrap_debian13.sh
      - tools/dancers-runtime/render_cpu_image.sh
      - .github/workflows/dancers-runtime-tools-mailbox.yml
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify tools
        run: |
          set -euo pipefail
          python3 -m py_compile tools/dancers-runtime/danceseq.py tools/dancers-runtime/compile_plan.py
          python3 tools/dancers-runtime/test_danceseq.py
          python3 tools/dancers-runtime/test_compile_plan.py
          bash -n tools/dancers-runtime/accept_internal_vm.sh
          bash -n tools/dancers-runtime/bootstrap_debian13.sh
          bash -n tools/dancers-runtime/render_cpu_image.sh
      - name: Package airgap toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capsule/dancers-runtime
          cp tools/dancers-runtime/danceseq.py capsule/dancers-runtime/
          cp tools/dancers-runtime/compile_plan.py capsule/dancers-runtime/
          cp tools/dancers-runtime/blender_compile_state.py capsule/dancers-runtime/
          cp tools/dancers-runtime/accept_internal_vm.sh capsule/dancers-runtime/
          cp tools/dancers-runtime/bootstrap_debian13.sh capsule/dancers-runtime/
          cp tools/dancers-runtime/render_cpu_image.sh capsule/dancers-runtime/
          chmod +x capsule/dancers-runtime/accept_internal_vm.sh capsule/dancers-runtime/bootstrap_debian13.sh capsule/dancers-runtime/render_cpu_image.sh
          (cd capsule && find dancers-runtime -type f -print0 | sort -z | xargs -0 sha256sum) > capsule/SHA256SUMS
          tar -C capsule -czf dancers-runtime-tools.tar.gz .
          sha256sum dancers-runtime-tools.tar.gz > dancers-runtime-tools.tar.gz.sha256
      - name: Upload tools mailbox
        uses: actions/upload-artifact@v4
        with:
          name: dancers-runtime-tools
          path: |
            dancers-runtime-tools.tar.gz
            dancers-runtime-tools.tar.gz.sha256
          compression-level: 0
          retention-days: 7
