name: chatgpt-torsion-node-count-overflow

on:
  push:
    branches:
      - chatgpt/torsion-node-count-overflow-repair-20260807
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Establish pre-repair overflow failure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p chatgpt-lab/evidence-count-overflow
          set +e
          cargo test --locked --manifest-path torsion-node/Cargo.toml --test worker_overflow -- --nocapture >chatgpt-lab/evidence-count-overflow/pre-repair.log 2>&1
          rc=$?
          set -e
          echo "pre_repair_exit=$rc" | tee chatgpt-lab/evidence-count-overflow/pre-repair-exit.txt
          test "$rc" -ne 0
          grep -E 'attempt to add with overflow|panicked' chatgpt-lab/evidence-count-overflow/pre-repair.log
          echo TORSION_NODE_COUNT_OVERFLOW_RED_VERIFIED > chatgpt-lab/evidence-count-overflow/RESULT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: torsion-node-count-overflow-red-evidence
          path: chatgpt-lab/evidence-count-overflow/
          if-no-files-found: error
          retention-days: 14
