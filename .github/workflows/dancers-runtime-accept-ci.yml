name: dancers-runtime-accept-ci
on:
  push:
    branches:
      - chatgpt/dancers-runtime-mailbox-20260929
    paths:
      - .github/workflows/dancers-runtime-accept-ci.yml
      - tools/dancers-runtime/danceseq.py
      - tools/dancers-runtime/compile_plan.py
      - tools/dancers-runtime/blender_compile_state.py
  workflow_dispatch:

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Acquire pinned portable executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime out
          BLENDER_VER=4.5.14
          BLENDER_FILE="blender-${BLENDER_VER}-linux-x64.tar.xz"
          curl -fL --retry 5 --retry-delay 2 -o "runtime/${BLENDER_FILE}" "https://download.blender.org/release/Blender4.5/${BLENDER_FILE}"
          curl -fL --retry 5 --retry-delay 2 -o runtime/blender.sha256 "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VER}.sha256"
          grep "${BLENDER_FILE}" runtime/blender.sha256 | (cd runtime && sha256sum -c -)
          tar -C runtime -xf "runtime/${BLENDER_FILE}"

          SD_TAG=master-929-3f8527a
          SD_FILE=sd-master-3f8527a-bin-Linux-Ubuntu-24.04-x86_64.zip
          curl -fL --retry 5 --retry-delay 2 -o "runtime/${SD_FILE}" "https://github.com/leejet/stable-diffusion.cpp/releases/download/${SD_TAG}/${SD_FILE}"
          echo "9ad35ed309dbe59f5e66f35edafac9a69e6cc233ea6b9577071feae829159d37  runtime/${SD_FILE}" | sha256sum -c -
          unzip -q "runtime/${SD_FILE}" -d runtime/sd

          GLTFPACK_FILE=gltfpack-ubuntu.zip
          curl -fL --retry 5 --retry-delay 2 -o "runtime/${GLTFPACK_FILE}" "https://github.com/zeux/meshoptimizer/releases/download/v1.3/${GLTFPACK_FILE}"
          echo "0666d9dc40d60fe5b9a45f3fc24f8e6ca87112974bd5de9ca57152aa13d06017  runtime/${GLTFPACK_FILE}" | sha256sum -c -
          unzip -q "runtime/${GLTFPACK_FILE}" -d runtime/gltfpack
          chmod +x runtime/gltfpack/gltfpack || true

      - name: Compile canonical DANCESEQ into deterministic state
        shell: bash
        run: |
          set -euo pipefail
          cat > out/five-dancer.danceseq <<'EOF'
          DANCESEQ/1
          bpm 124
          fps 24
          duration_frames 96
          FORM V_SHALLOW
          F001 ALL pose neutral
          F024 D1,D5 step inward 0.31m
          F024 D3 pelvis.z -0.19m
          F048 ALL pelvis.yaw -18deg
          F048 ALL chest.look camera
          F072 ALL root.z +0.17m
          F072 ALL root.y -0.24m
          F096 ALL pose loop_ready
          CONTACT preserve_support
          EOF
          python3 tools/dancers-runtime/danceseq.py out/five-dancer.danceseq -o out/five-dancer.plan.json
          python3 tools/dancers-runtime/compile_plan.py out/five-dancer.danceseq -o out/five-dancer.state.json
          python3 - <<'PY'
          import json
          p=json.load(open('out/five-dancer.plan.json'))
          s=json.load(open('out/five-dancer.state.json'))
          assert p['schema']=='DANCESEQ/1' and p['stats']['event_count']==8
          assert s['schema']=='DANCESTATE/1' and s['valid'] is True and s['actor_count']==5
          print(json.dumps({'events':p['stats']['event_count'],'state_frames':len(s['frames']),'diagnostics':s['diagnostics']},sort_keys=True))
          PY

      - name: Execute Blender from DANCESTATE and export
        shell: bash
        run: |
          set -euo pipefail
          BLENDER=$(find runtime -maxdepth 3 -type f -name blender -perm -111 | head -n1)
          test -n "$BLENDER"
          "$BLENDER" --version | tee out/blender-version.txt
          CMD=("$BLENDER" -b --python tools/dancers-runtime/blender_compile_state.py -- --state "$PWD/out/five-dancer.state.json" --out "$PWD/out" --preview-frame 48)
          if command -v xvfb-run >/dev/null 2>&1; then xvfb-run -a "${CMD[@]}"; else "${CMD[@]}"; fi
          test -s out/blender-receipt.json
          test -s out/five-dancer.blend
          test -s out/five-dancer-raw.glb

      - name: Compress GLB and probe CPU diffusion binary
        shell: bash
        run: |
          set -euo pipefail
          GLTFPACK=$(find runtime/gltfpack -type f -name gltfpack -perm -111 | head -n1 || true)
          test -n "$GLTFPACK"
          "$GLTFPACK" -i out/five-dancer-raw.glb -o out/five-dancer-packed.glb -cc > out/gltfpack.txt 2>&1 || \
            "$GLTFPACK" -i out/five-dancer-raw.glb -o out/five-dancer-packed.glb > out/gltfpack.txt 2>&1
          test -s out/five-dancer-packed.glb

          SD_BIN=$(find runtime/sd -type f -perm -111 \( -name 'sd-cli' -o -name 'sd' \) | head -n1 || true)
          if [[ -z "$SD_BIN" ]]; then SD_BIN=$(find runtime/sd -type f -perm -111 | head -n1 || true); fi
          printf '%s\n' "$SD_BIN" > out/sd-binary.txt
          if [[ -n "$SD_BIN" ]]; then
            "$SD_BIN" --help > out/sd-help.txt 2>&1 || true
            ldd "$SD_BIN" > out/sd-ldd.txt 2>&1 || true
          fi
          lscpu > out/lscpu.txt
          cat /proc/meminfo > out/meminfo.txt
          uname -a > out/uname.txt

      - name: Build machine-readable end-to-end receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib, os, platform, pathlib
          out=pathlib.Path('out')
          r=json.load(open(out/'blender-receipt.json'))
          state=json.load(open(out/'five-dancer.state.json'))
          plan=json.load(open(out/'five-dancer.plan.json'))
          def digest(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()
          files={}
          for p in sorted(out.iterdir()):
              if p.is_file() and p.name not in {'ACCEPTANCE_RECEIPT.json','sha256sums.txt'}:
                  files[p.name]={'bytes':p.stat().st_size,'sha256':digest(p)}
          ok={x.get('label'):x.get('status')=='ok' for x in r.get('renders',[])}
          acc={
              'danceseq_parsed':plan.get('schema')=='DANCESEQ/1',
              'state_compiled':state.get('schema')=='DANCESTATE/1' and state.get('valid') is True,
              'state_consumed_by_blender':r.get('schema')=='BLENDER_DANCESTATE_RECEIPT/1' and r.get('source_state_sha256')==digest(out/'five-dancer.state.json'),
              'blend_created':(out/'five-dancer.blend').exists(),
              'raw_glb_created':(out/'five-dancer-raw.glb').exists(),
              'packed_glb_created':(out/'five-dancer-packed.glb').exists(),
              'workbench_ok':ok.get('workbench',False),
              'eevee_ok':ok.get('eevee',False),
              'cycles_cpu_ok':ok.get('cycles_cpu',False),
          }
          acc['render_matrix_complete']=all(acc[k] for k in ('workbench_ok','eevee_ok','cycles_cpu_ok'))
          acc['pass_core']=all(acc[k] for k in ('danceseq_parsed','state_compiled','state_consumed_by_blender','blend_created','raw_glb_created','packed_glb_created','cycles_cpu_ok'))
          final={
              'schema':'DANCERS_RUNTIME_ACCEPTANCE/2',
              'host':{'platform':platform.platform(),'machine':platform.machine(),'processor':platform.processor(),'cpu_count':os.cpu_count()},
              'semantic':{'event_count':plan['stats']['event_count'],'state_frames':len(state['frames']),'diagnostics':state['diagnostics']},
              'blender':r,
              'sd_probe':{'binary':(out/'sd-binary.txt').read_text(errors='replace').strip(),'help_captured':(out/'sd-help.txt').exists(),'model_downloaded':False},
              'artifacts':files,
              'acceptance':acc,
          }
          json.dump(final,open(out/'ACCEPTANCE_RECEIPT.json','w'),indent=2)
          print(json.dumps(acc,indent=2))
          if not acc['pass_core']:
              raise SystemExit('core acceptance failed')
          PY
          sha256sum out/* > out/sha256sums.txt
          cat out/ACCEPTANCE_RECEIPT.json

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dancers-runtime-acceptance-v2
          path: out/
          retention-days: 7
