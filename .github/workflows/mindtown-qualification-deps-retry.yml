name: MindTown qualification dependency retry

on:
  push:
    paths:
      - .github/workflows/mindtown-qualification-deps-retry.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: scriptscat__scriptcat
            repo: scriptscat/scriptcat
            manager: pnpm
            version: 10.34.1
          - slug: srbhptl39__MCP-SuperAssistant
            repo: srbhptl39/MCP-SuperAssistant
            manager: pnpm
            version: 9.15.1
          - slug: donmccurdy__glTF-Transform
            repo: donmccurdy/glTF-Transform
            manager: yarn
            version: 4.17.0
          - slug: vercel-labs__agent-browser
            repo: vercel-labs/agent-browser
            manager: pnpm-rust
            version: 11.1.3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.manager == 'pnpm-rust'
      - name: Download exact source and install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          export COREPACK_HOME="$HOME/.cache/node/corepack"
          corepack enable
          corepack prepare '${{ matrix.manager == 'yarn' && 'yarn' || 'pnpm' }}@${{ matrix.version }}' --activate
          sha="$(git ls-remote "https://github.com/${{ matrix.repo }}.git" HEAD | awk '{print $1}')"
          url="https://gh-proxy.com/https://github.com/${{ matrix.repo }}/archive/${sha}.zip"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$url" -o source.zip
          unzip -tq source.zip
          unzip -q source.zip -d unpacked
          src="$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -1)"
          mv "$src" repo
          cd repo
          case '${{ matrix.manager }}' in
            pnpm|pnpm-rust) corepack pnpm install --frozen-lockfile --ignore-scripts ;;
            yarn) corepack yarn install --immutable ;;
          esac
          if [ '${{ matrix.manager }}' = 'pnpm-rust' ]; then
            mkdir -p .cargo
            cargo vendor vendor > .cargo/config.toml
          fi
          cd ..
          mkdir -p prepared
          printf '%s\t%s\t%s\n' '${{ matrix.repo }}' "$sha" "$url" > prepared/SOURCE_LOCK.tsv
          sha256sum source.zip > prepared/SOURCE_ARCHIVE_SHA256
          tar -I 'zstd -T0 -3' -cf 'prepared/${{ matrix.slug }}.tar.zst' repo
          du -h prepared/*
      - uses: actions/upload-artifact@v4
        with:
          name: mindtown-prepared-${{ matrix.slug }}-retry
          path: prepared/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
