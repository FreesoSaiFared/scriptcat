name: chatgpt-torsionfield-lab-convergence

on:
  push:
    branches:
      - chatgpt/torsionfield-lab-convergence-20260808
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Apply request-identity repair on the real convergence tree
        shell: bash
        run: |
          set -euo pipefail
          python3 chatgpt-lab/apply-request-fingerprint-repair.py
          cargo fmt --manifest-path torsion-node/Cargo.toml -- --check
      - name: Verify combined Torsion Node repairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p chatgpt-lab/evidence-convergence
          cargo test --locked --manifest-path torsion-node/Cargo.toml --test operation_id_collision -- --nocapture | tee chatgpt-lab/evidence-convergence/operation-id.log
          cargo test --locked --manifest-path torsion-node/Cargo.toml --test operation_request_fingerprint -- --nocapture | tee chatgpt-lab/evidence-convergence/request-fingerprint.log
          cargo test --locked --manifest-path torsion-node/Cargo.toml | tee chatgpt-lab/evidence-convergence/torsion-node.log
      - name: Install exact ScriptCat dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify offscreen recreation plus production extension gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run packages/message/window_message.test.ts --no-coverage --reporter=verbose | tee chatgpt-lab/evidence-convergence/offscreen-rebind.log
          pnpm run typecheck | tee chatgpt-lab/evidence-convergence/typecheck.log
          pnpm run build:torsionfield | tee chatgpt-lab/evidence-convergence/build.log
      - name: Record convergence evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > chatgpt-lab/evidence-convergence/RESULT.txt <<'EOF'
          TORSIONFIELD_ISOLATED_CONVERGENCE_VERIFIED
          base: chatgpt/torsion-node-count-overflow-repair-20260807 @ 8dfa71ba3367489f17a8443f611bc774b70b45ce
          retained: real count_tests saturating-add repair + 5/5 cargo-mutants coverage
          retained: real ScriptCat offscreen client rebind repair
          added dynamically: durable request fingerprint = requestedAction + actorId + input; routing excluded
          verified: different-action operation-id collision rejected
          verified: same-action/different-actor collision rejected
          verified: same-action/different-input collision rejected
          verified: exact logical request receipt replay preserved
          verified: legacy receipt action-level fallback preserved
          verified: normal Torsion Node suite passed
          verified: offscreen recreation focused suite passed
          verified: TypeScript typecheck passed
          verified: Torsionfield production build passed
          STATUS: isolated semantic donor only; Windows authoritative integration remains for Codex.
          EOF
          git diff -- torsion-node/src/protocol.rs torsion-node/src/server.rs torsion-node/tests/persistence.rs > chatgpt-lab/evidence-convergence/request-identity-product.diff
          sha256sum torsion-node/src/protocol.rs torsion-node/src/server.rs torsion-node/src/worker.rs packages/message/window_message.ts torsion-node/tests/operation_id_collision.rs torsion-node/tests/operation_request_fingerprint.rs > chatgpt-lab/evidence-convergence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: torsionfield-isolated-convergence-evidence
          path: chatgpt-lab/evidence-convergence/
          if-no-files-found: error
          retention-days: 14
